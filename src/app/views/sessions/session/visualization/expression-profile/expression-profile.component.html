<div *ngIf="!state.isReady(); then statusTemplate"></div>

<div class="row">
  <div class="col-md-9">
    <div id="expressionprofile"></div>
  </div>

  <div class="col-md-3" id="selectedGeneList" *ngIf="state.isReady()">
    <h6 class="lighter">Selection</h6>
    <ng-container *ngIf="selectedGeneExpressions && selectedGeneExpressions.length > 0; else noSelection">
      <div class="d-flex align-items-center mb-3">
        <p class="text-sm mb-0">{{ selectedGeneExpressions.length }}/{{ totalCount }} features</p>
        <button class="btn btn-primary btn-sm ms-auto" (click)="createNewDataset()">Create file</button>
      </div>
      <hr class="mt-1 mb-2" />
      <table class="table table-sm text-sm">
        <thead>
          <tr>
            <th scope="col" *ngIf="showSymbolColumn">Symbol</th>
            <th scope="col">Identifier</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let selection of viewSelectionList">
            <td *ngIf="showSymbolColumn">{{ selection.symbol }}</td>
            <td>{{ selection.identifier }}</td>
          </tr>
        </tbody>
      </table>
    </ng-container>
    <ng-template #noSelection>
      <p class="fst-italic text-smaller">Select features by clicking or drawing a rectangle</p>
    </ng-template>
  </div>
</div>

<ng-template #statusTemplate>
  <ch-status [state]="state"></ch-status>
</ng-template>
