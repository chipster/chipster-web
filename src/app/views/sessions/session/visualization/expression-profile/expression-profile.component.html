<div *ngIf="!state.isReady(); then statusTemplate"></div>

<div class="row">
  <div class="col-md-9">
    <div id="expressionprofile"></div>
  </div>

  <div class="col-md-3" id="selectedGeneList" *ngIf="state.isReady()">
    <h6 class="lighter mt-3">Selection</h6>
    <ng-container *ngIf="selectedGeneExpressions && selectedGeneExpressions.length > 0; else noSelection">
      <div class="btn-group me-2 mb-3" role="group">
        <button class="btn btn-primary btn-sm" (click)="createNewDataset()">Create file</button>
      </div>
      <p class="text-sm">{{ selectedGeneExpressions.length }} selected</p>
      <hr class="mt-1 mb-2" />
      <table class="table table-sm">
        <thead>
          <tr>
            <td>Symbol</td>
            <td>Identifier</td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let selection of viewSelectionList">
            <td class="text-sm">{{ selection.symbol }}</td>
            <td class="text-sm">{{ selection.identifier }}</td>
          </tr>
        </tbody>
      </table>
    </ng-container>
    <ng-template #noSelection>
      <p class="text-sm">Draw a rectangle to select data points.</p>
    </ng-template>
  </div>
</div>

<ng-template #statusTemplate>
  <ch-status [state]="state"></ch-status>
</ng-template>
