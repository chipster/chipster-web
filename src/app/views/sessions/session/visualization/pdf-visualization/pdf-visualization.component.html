<ng-container *ngIf="!state.isReady()">
  <ch-status [state]="state" (buttonEvent)="onStatusButton($event)"></ch-status>
  <progress *ngIf="state.isLoading()"></progress>
</ng-container>
<!-- the viewer has its own toolbar for zooming, paging and searching -->
<div #viewerContainer class="pdf-viewer" [class.pdf-viewer-ready]="state.isReady()"></div>
