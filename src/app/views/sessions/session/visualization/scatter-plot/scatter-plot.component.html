<div *ngIf="!state.isReady(); then statusTemplate"></div>

<div class="row">
  <div class="col-md-8">
    <div id="scatterplot"></div>
  </div>
  <div class="col-md-4" *ngIf="state.isReady()" id="setting">
    <h6 class="lighter mb-0">Parameters</h6>
    <label for="selectXaxis" class="text-sm">X-axis</label>
    <select
      class="form-control"
      id="selectXaxis"
      [(ngModel)]="selectedXAxisHeader"
      (ngModelChange)="setXAxisHeader($event)">
      <option *ngFor="let header of chipHeaders">{{ header }}</option>
    </select>

    <label for="selectYaxis" class="text-sm">Y-Axis</label>
    <select
      class="form-control"
      id="selectYaxis"
      [(ngModel)]="selectedYAxisHeader"
      (ngModelChange)="setYAxisHeader($event)">
      <option class="text-sm" *ngFor="let header of chipHeaders">{{ header }}</option>
    </select>
    <div id="selectedGeneList">
      <h6 class="lighter mt-4">Selection</h6>
      <ng-container *ngIf="selectedDataRows && selectedDataRows.length > 0; else noSelection">
        <div class="d-flex align-items-center mb-3">
          <p class="text-sm mb-0">{{ selectedDataRows.length }}/{{ plotData.length }} features</p>
          <button class="btn btn-primary btn-sm ms-auto" (click)="createDatasetFromSelected()">Create file</button>
        </div>
        <hr class="mt-1 mb-2" />
        <table class="table table-sm text-sm">
          <thead>
            <tr>
              <th scope="col" *ngIf="showSymbolColumn">Symbol</th>
              <th scope="col">Identifier</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let selection of viewSelectionList">
              <td *ngIf="showSymbolColumn">{{ selection.symbol }}</td>
              <td>{{ selection.identifier }}</td>
            </tr>
          </tbody>
        </table>
      </ng-container>
      <ng-template #noSelection>
        <p class="text-sm">Draw a rectangle to select data points.</p>
      </ng-template>
    </div>
  </div>
</div>

<ng-template #statusTemplate>
  <ch-status [state]="state" (buttonEvent)="showAnyway()"></ch-status>
</ng-template>
