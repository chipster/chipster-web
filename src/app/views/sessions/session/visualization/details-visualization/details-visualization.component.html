<!-- a new component for each file, so that the box of the next file doesn't keep text typed into the
  previous one's notes, which the value binding doesn't rewrite when the files have the same notes -->
@for (dataset of datasets().length === 1 ? datasets() : []; track dataset.datasetId) {
  <ch-single-dataset
    [dataset]="dataset"
    [jobs]="sessionData().jobsMap()"
    [sessionData]="sessionData()"
    [tools]="tools()"
    [parametersLimit]="-1"></ch-single-dataset>
}

@if (datasets().length > 1) {
  <ch-files-details [datasets]="datasets()" [sessionData]="sessionData()"></ch-files-details>
}
